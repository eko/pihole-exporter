name: Build/Push (tag)

on:
  push:
    tags:
      - "*"

env:
  GO_VERSION: "1.27"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -v -race ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ekofr/pihole-exporter:${{ github.ref_name }}
            ekofr/pihole-exporter:latest

  release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      # The release may already exist when it was created with its notes before the tag.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  upload-binaries:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: amd64
          # "arm" is kept for existing download links and is the same build as "armv7".
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: arm
            goarm: "6"
            name: armv6
          - goos: linux
            goarch: arm
            goarm: "7"
            name: armv7
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: "386"
            extension: ".exe"
          - goos: windows
            goarch: amd64
            extension: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary and checksum
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ -n "${{ matrix.goarm }}" ]; then export GOARM="${{ matrix.goarm }}"; fi
          FILE="pihole_exporter-${{ matrix.goos }}-${{ matrix.name || matrix.goarch }}${{ matrix.extension }}"
          go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "$FILE" .
          sha256sum "$FILE" > "$FILE.sha256.txt"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload binary and checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$FILE" "$FILE.sha256.txt" --repo "$GITHUB_REPOSITORY" --clobber
